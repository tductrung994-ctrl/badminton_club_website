<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên - CLB Cầu lông</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">Badminton Club</div>
            <nav class="nav-links">
                <a href="index.html">Trang chủ</a>
                <a href="login.html">Đăng nhập</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Đăng ký tài khoản thành viên</h2>
            <form id="form-register">
                <div class="form-group">
                    <label for="fullname">Họ và tên: *</label>
                    <input type="text" id="fullname" required minlength="2" placeholder="Nhập họ tên đầy đủ">
                </div>

                <div class="form-group">
                    <label for="email">Email (Tài khoản): *</label>
                    <input type="email" id="email" required placeholder="NguyenVanB123@gmail.com">
                    <span class="error-msg" id="err-email" style="color: crimson;"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu: *</label>
                    <input type="password" id="password" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                </div>

                <button type="submit" class="btn-primary">Đăng ký ngay</button>
                <p class="switch-link">Đã có tài khoản? <a href="login.html">Đăng nhập tại đây</a></p>
            </form>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
