<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CLB Cầu lông</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">Badminton Club</div>
            <nav class="nav-links">
                <a href="index.html">Trang chủ</a>
                <a href="register.html">Đăng ký</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Đăng nhập hệ thống</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Email: *</label>
                    <input type="email" id="login-email" required placeholder="Nhập email của bạn">
                </div>

                <div class="form-group">
                    <label for="login-password">Mật khẩu: *</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu">
                </div>

                <span class="error-msg" id="err-login" style="color: crimson; display: block; margin-bottom: 10px;"></span>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
